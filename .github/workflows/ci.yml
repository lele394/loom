name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm rebuild better-sqlite3 esbuild
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run build
