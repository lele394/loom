services:
  loom:
    build: .
    container_name: loom
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      LOOM_DATA_DIR: /data
      # Set a long random secret and keep it with your backups:
      # LOOM_SECRET: change-me-to-a-long-random-string
      # Enable when behind an HTTPS reverse proxy:
      LOOM_SECURE_COOKIES: "false"
      LOOM_TRUST_PROXY: "false"
      LOOM_MAX_UPLOAD_MB: "50"
      LOOM_MAX_STORAGE_GB: "10"
